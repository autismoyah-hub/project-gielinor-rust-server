[package]
autotests = false
autoexamples = false
name = "gielinor-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
integration-fixtures = []

[dependencies]
gielinor-protocol = { path = "../protocol" }
gielinor-world = { path = "../world" }
gielinor-storage = { path = "../storage" }
gielinor-cache = { path = "../cache" }

[[example]]
